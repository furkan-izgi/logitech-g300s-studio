<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Aura -->
    <radialGradient id="cyberAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Crest Titanium Gradient -->
    <linearGradient id="armorShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- Chrome Chamfer Border -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Core Cyber G Gradient -->
    <linearGradient id="neonCoreG" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="30%" stop-color="#00B4D8"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="innerPrism" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- High-Precision Tactical Accents -->
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Glow Filter for Cyber Neon -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#cyberAura)" />

  <!-- Outer Cyber Crest Shield (Faceted Hexagonal Geometry) -->
  <g filter="url(#crestShadow)">
    <!-- Base Armor Plate -->
    <polygon points="256,36 436,110 436,340 256,476 76,340 76,110"
             fill="url(#armorShield)"
             stroke="url(#shieldBorder)"
             stroke-width="5"
             stroke-linejoin="round" />

    <!-- Inner Inset Plate -->
    <polygon points="256,54 418,120 418,328 256,454 94,328 94,120"
             fill="#0E0F14"
             stroke="#1E222D"
             stroke-width="2.5"
             stroke-linejoin="round" />

    <!-- Tactical Precision Corner Tick Marks -->
    <line x1="256" y1="42" x2="256" y2="60" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="428" y1="114" x2="412" y2="122" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="428" y1="334" x2="412" y2="326" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="256" y1="468" x2="256" y2="450" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="334" x2="100" y2="326" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="84" y1="114" x2="100" y2="122" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Cybernetic Grid & Angle Lattice (Subtle High-Tech Texture) -->
  <g stroke="#1A202C" stroke-width="1.2" opacity="0.65">
    <line x1="160" y1="120" x2="352" y2="120" />
    <line x1="120" y1="200" x2="392" y2="200" />
    <line x1="120" y1="280" x2="392" y2="280" />
    <line x1="160" y1="360" x2="352" y2="360" />
    <line x1="256" y1="80" x2="256" y2="430" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#161B26" stroke-dasharray="4,8" stroke-width="1.5" />
  </g>

  <!-- ==================== ICONIC CYBERNETIC APEX 'G' LOGO ==================== -->
  <g filter="url(#neonBloom)">
    <!-- Outer Kinetic Arc of G -->
    <path d="M 334,152
             L 256,152
             C 192,152 148,198 148,256
             C 148,314 192,360 256,360
             C 320,360 364,314 364,256
             L 364,242
             L 250,242
             L 250,278
             L 322,278
             C 316,306 290,324 256,324
             C 214,324 186,294 186,256
             C 186,218 214,188 256,188
             L 334,188
             Z"
          fill="url(#neonCoreG)"
          stroke="#00F0FF"
          stroke-width="1.5"
          stroke-linejoin="bevel" />

    <!-- Diamond Core Shard (Geometric Apex Prism) -->
    <polygon points="256,204 290,256 256,308 222,256"
             fill="url(#innerPrism)"
             stroke="#E0F2FE"
             stroke-width="1.8"
             opacity="0.9" />

    <!-- Center Quantum Core Point -->
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="14" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.8" />
  </g>

  <!-- Tactical Laser Slash Accents & Studio Chevron -->
  <g>
    <!-- Top-Right Speed Fin -->
    <polygon points="348,138 386,138 368,162 330,162" fill="url(#goldLaser)" opacity="0.9"/>
    <!-- Bottom-Left Anchor Fin -->
    <polygon points="126,350 164,350 182,326 144,326" fill="url(#goldLaser)" opacity="0.9"/>

    <!-- High-Tech Coordinate Marks -->
    <text x="256" y="94" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="800"
          letter-spacing="4" fill="#00F0FF" text-anchor="middle" opacity="0.85">G300S // APEX CORE</text>
    <text x="256" y="424" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700"
          letter-spacing="5" fill="#A855F7" text-anchor="middle" opacity="0.85">PRECISION STUDIO</text>
  </g>
</svg>
