<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gLogoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0E1118" stroke="#00D4FF" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Minimalist Logitech G Glyph -->
  <path d="M 46,20 A 18,18 0 1 0 50,32 H 32"
