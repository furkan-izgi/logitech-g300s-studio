[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g300s"
version = "1.0.0"
description = "Logitech G300s Optical Gaming Mouse Onboard Memory & Realtime Hardware Control Tool"
readme = "PROTOCOL.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "feaz" }
]
dependencies = [
    "hidapi>=0.14.0",
]

[project.scripts]
g300s = "g300s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
